name: Update Rates

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repozitoriyanı yüklə
        uses: actions/checkout@v4

      - name: Python mühitini qur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Lazımi kitabxanaları quraşdır
        run: |
          pip install requests

      - name: Skripti işə sal
        run: |
          python scraper.py

      - name: Dəyişiklikləri yadda saxla və push et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add rates.json
          git diff --staged --quiet || (git commit -m "Auto-update currency rates" && git push)
